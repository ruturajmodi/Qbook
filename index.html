.switch{position:relative;width:46px;height:27px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);flex:none;transition:.2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:.2s}
.switch.on{background:var(--brand);border-color:var(--brand)}.switch.on::after{transform:translateX(19px)}
.dlg-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:rgba(6,12,31,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
.dlg-wrap.show{opacity:1;pointer-events:auto}
.dlg{width:min(380px,100%);background:var(--bg2);border-radius:20px;padding:22px;transform:scale(.94);transition:transform .25s cubic-bezier(.2,.9,.3,1.2)}
.dlg-wrap.show .dlg{transform:none}
.dlg h3{font-size:18px;font-weight:800;margin-bottom:6px}.dlg p{color:var(--muted);font-size:14px;margin-bottom:18px}
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--sab) + 18px);z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;background:#14203f;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.35);animation:toastIn .32s cubic-bezier(.2,.9,.3,1.2);max-width:100%}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}.toast button{color:#8db8ff;font-weight:800}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.hint{font-size:12px;color:var(--faint);margin:8px 4px 0}
#splash{position:fixed;inset:0;z-index:200;color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(var(--sat) + 8vh) 28px calc(var(--sab) + 28px);
  background:radial-gradient(90% 50% at 50% 38%,rgba(22,115,255,.45),transparent 70%),linear-gradient(180deg,#050a1c,#07102b 60%,#040818);transition:opacity .4s,transform .4s}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .art{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px}
#splash h1{font-size:38px;font-weight:300;letter-spacing:-.02em;margin-top:18px}#splash h1 b{font-weight:800}
#splash p{font-size:11.5px;letter-spacing:.22em;color:#8fa6d6;margin-top:8px}
#splash .btns{width:100%;max-width:420px;display:grid;gap:10px}
#splash .btn{padding:15px;font-size:16px;border-radius:14px}
#splash .btn.ghost{background:none;color:#fff;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- merged additions (from QBook v1) ---- */
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 8px;font-size:12.5px;font-weight:800;color:var(--muted)}
.sumstrip{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 4px;padding:12px 6px;text-align:center}
.sumstrip small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.sumstrip b{font-size:16px;font-weight:800}
.sumstrip>div+div{border-left:1px solid var(--line)}
.acct-card{display:flex;align-items:center;gap:12px;border-radius:18px;padding:16px;border:1px solid var(--line);
  background:radial-gradient(120% 140% at 0% 0%,rgba(22,115,255,.16),transparent 60%),radial-gradient(100% 120% at 100% 0%,rgba(124,92,255,.14),transparent 55%),var(--surface);box-shadow:var(--shadow)}
.acct-card .v{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.brow{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:10px;margin-top:12px}
.brow:first-child{margin-top:0}
.brow .bl b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bl small{font-size:11px;color:var(--faint)}
.brow .bt{height:10px;border-radius:9px;background:var(--surface2);overflow:hidden}
.brow .bt i{display:block;height:100%;border-radius:9px}
.brow .bv{font-size:13px;font-weight:800;min-width:70px;text-align:right}
.chip-input{flex:none;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);outline:none;max-width:150px}
.chip-input.on{background:var(--brand);border-color:var(--brand);color:#fff}
.wk-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.wk-row:last-child{border-bottom:0}
.wk-row .main{flex:1;min-width:0}
.wk-row .main b{display:block;font-weight:700}
.wk-row .main small{color:var(--muted);font-size:12px}

/* ---- calendar (card-per-day design) ---- */
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--faint);margin:16px 0 8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;touch-action:pan-y}
.cell{aspect-ratio:1/1.12;min-width:0;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 2px 7px;font-size:13px;font-weight:600;color:var(--muted);transition:transform .12s,border-color .15s}
.cell .d{line-height:1}
.cell .p{font-size:10px;font-weight:700;letter-spacing:-.03em;line-height:1;min-height:10px;max-width:100%;white-space:nowrap}
.cell.has{color:var(--text);cursor:pointer}
.cell:active:not(.empty){transform:scale(.94)}
.cell.today .d{color:var(--brand);font-weight:800}
.cell.has.today .d{color:inherit}
.cell.sel{border:2.5px solid var(--brand);padding:7px 1px 6px}
.cell.empty{visibility:hidden;border:0}
/* ---- spacing / overflow audit fixes ---- */
.num{white-space:nowrap}
.grid2,.grid3{gap:12px}
.sec{margin:22px 2px 10px}
.pl-card .v,.acct-card .v{white-space:nowrap;overflow:hidden}
.pl-card .v{font-size:25px}.pl-card .sp{width:38%}
.perf .p{width:auto;min-width:88px;white-space:nowrap}
.sheet-body .tabs,.sheet-body .tabs.wide{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
.btn-row .btn,.btn-row3 .btn{min-width:0}
.pr-hero{display:flex;align-items:center;gap:14px}
.pr-hero small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sec.small{margin-top:24px}
/* ---- print sheet + preview ---- */
.pr-grp{margin-top:20px}.pr-grp:first-child{margin-top:6px}
.pr-l{font-size:11.5px;font-weight:800;color:var(--muted);margin:0 0 9px 1px;text-transform:uppercase;letter-spacing:.06em}
.pr-hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.pr-grp .seg button{padding:11px 6px}
.seg.doc button{font-size:13px;padding:11px 2px}
#sheet-pv{height:100dvh;max-height:100dvh;border-radius:0;background:#e6ebf3}
:root.dark #sheet-pv{background:#0a1124}
@media(min-width:900px){#sheet-pv{left:0;right:0;top:0;bottom:0;width:auto;transform:translateY(100%);opacity:1;border-radius:0;max-height:none;height:100dvh}#sheet-pv.show{transform:none}}
.pv-top{display:flex;align-items:center;gap:8px;padding:calc(var(--sat) + 8px) 12px 8px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.pv-top b{display:block;font-size:16px}.pv-top small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.pv-opts{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:16px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none}
.pv-g{display:flex;align-items:center;gap:8px;flex:none}.pv-g>span{font-size:12px;font-weight:700;color:var(--muted)}
.pv-g .seg{gap:4px}.pv-g .seg button{padding:7px 11px;font-size:12.5px;border-radius:9px;white-space:nowrap}
.pv-scroll{flex:1;overflow:auto;padding:14px 12px 20px;display:block;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#pv-wrap{position:relative;margin:0 auto;background:#fff;box-shadow:0 6px 28px rgba(15,23,42,.22);border-radius:2px}
#pv-frame{position:absolute;left:0;top:0;border:0;background:#fff;display:block}
.pv-foot{display:flex;gap:10px;padding:12px 16px calc(12px + var(--sab));background:var(--bg2);border-top:1px solid var(--line);flex:none}
.pv-foot .btn{flex:1}
/* ---- splash ---- */
#splash .art svg{animation:spIn .8s cubic-bezier(.2,.8,.2,1) both}
#splash h1,#splash p{animation:spUp .7s .25s ease both}
@keyframes spIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#splash .sp-load{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:28px;display:none}
#splash.auto .sp-load{display:block}#splash.auto .btns{visibility:hidden}
#splash .sp-load i{display:block;height:100%;width:0;background:#3b8bff;border-radius:3px;animation:spLoad 1.2s ease forwards}
@keyframes spLoad{to{width:100%}}

/* ---- longer splash sequence (~3.4s) ---- */
#splash .art svg{animation:none}
#splash .hx-line{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw 1.3s .15s cubic-bezier(.6,.1,.2,1) forwards}
#splash .hx-glow{opacity:0;animation:spGlow 1.4s .9s ease forwards}
#splash .hx-core{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spPop .6s 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
#splash .hx-tick{stroke-dasharray:100;stroke-dashoffset:100;animation:spDraw .6s 1.55s ease forwards}
#splash .wk{opacity:0;animation:spFade .8s .5s ease forwards}
#splash .cn rect{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:spGrow .7s cubic-bezier(.2,.9,.3,1.2) forwards}
#splash .cn rect:nth-child(1){animation-delay:.5s}#splash .cn rect:nth-child(2){animation-delay:.62s}#splash .cn rect:nth-child(3){animation-delay:.74s}#splash .cn rect:nth-child(4){animation-delay:.86s}#splash .cn rect:nth-child(5){animation-delay:.98s}
#splash .cn rect:nth-child(6){animation-delay:1.1s}#splash .cn rect:nth-child(7){animation-delay:1.22s}#splash .cn rect:nth-child(8){animation-delay:1.34s}#splash .cn rect:nth-child(9){animation-delay:1.46s}#splash .cn rect:nth-child(10){animation-delay:1.58s}
#splash h1{animation:spUp .8s 1.5s ease both}#splash p{animation:spUp .8s 1.8s ease both}
#splash .sp-load{animation:spFade .5s 1.9s ease both;opacity:0}
#splash .sp-load i{animation:spLoad 1.4s 2s cubic-bezier(.3,.1,.2,1) forwards}
#splash .sp-status{display:none;margin-top:12px;font-size:12px;letter-spacing:.08em;color:#8fa6d6;min-height:16px;opacity:0;animation:spFade .5s 2s ease forwards}
#splash.auto .sp-status{display:block}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spGlow{to{opacity:.7}}
@keyframes spPop{to{transform:scale(1)}}
@keyframes spFade{to{opacity:1}}
@keyframes spGrow{to{transform:scaleY(1)}}
#pv-guides{position:absolute;inset:0;pointer-events:none;z-index:3}
.pvg{position:absolute;left:0;right:0;height:0}
.pvg .ln{position:absolute;left:0;right:0;top:0;border-top:2px dotted #5b6b86}
.pvg.f .ln{border-top-color:var(--brand)}
.pvg.drag .ln{border-top-style:solid;border-top-color:var(--brand)}
.pvg .pvh{pointer-events:auto;touch-action:none;position:absolute;right:8px;top:-16px;height:32px;padding:0 12px;border-radius:16px;background:#334155;color:#fff;font:700 12px/32px system-ui,sans-serif;border:0;cursor:ns-resize;box-shadow:0 2px 10px rgba(0,0,0,.28);white-space:nowrap;-webkit-tap-highlight-color:transparent}
.pvg.f .pvh,.pvg.drag .pvh{background:var(--brand)}
@media print{#pv-guides{display:none!important}}
</style>
</head>
<body>
<div id="app">
  <nav class="nav"><div class="nav-inner">
    <button class="nav-btn active" data-nav="home" onclick="navTab('home')"><i data-ic="dash"></i><span>Dashboard</span></button>

    <button class="nav-btn" data-nav="analytics" onclick="navTab('analytics')"><i data-ic="chart"></i><span>Analytics</span></button>
    <button class="nav-btn" data-nav="more" onclick="navTab('more')"><i data-ic="menu"></i><span>More</span></button>

      <label class="searchbox"><i data-ic="search"></i><input id="j-q" type="search" placeholder="Search trades…" oninput="jState.limit=60;renderJournal()" autocomplete="off"></label>
      <div class="chips" id="j-chips"></div>
      <div id="j-list" style="margin-top:12px"></div>
    </section>

    <section class="view" id="v-more"></section>
    <section class="view" id="v-calendar"></section>
    <section class="view" id="v-risk"></section>
    <section class="view" id="v-capital"></section>
    <section class="view" id="v-reports"></section>
    <section class="view" id="v-data"></section>
    <section class="view" id="v-settings"></section>
    <section class="view" id="v-sub"></section>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>

<div class="sheet full" id="sheet-trade" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><button class="icon-btn" onclick="closeSheet()" aria-label="Close"><i data-ic="left"></i></button><h2 class="title-md grow" id="tf-title">New Trade</h2></div>
  <div class="sheet-body">
    <input type="hidden" id="f-id">
    <div class="tabs wide" id="f-mode" style="margin-top:0"><button class="on" data-v="quick" onclick="setMode('quick')">Quick Entry</button><button data-v="detailed" onclick="setMode('detailed')">Detailed Entry</button></div>
    <div class="with-btn">
      <label class="field grow" style="flex:2"><span>Symbol</span><input class="inp big" id="f-symbol" placeholder="e.g. NIFTY" autocapitalize="characters" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></label>
      <label class="field" style="flex:1"><span>Exchange</span><select class="inp" id="f-exchange"></select></label>
    </div>
    <div class="wrap-chips" id="f-recent" style="margin-top:10px"></div>
    <div class="fgroup"><label class="field"><span>Instrument</span><select class="inp" id="f-instrument" onchange="syncInstrument();calcLive()"></select></label></div>
    <div id="opt-block" style="display:none">
      <div class="fg"><div class="field"><span>Option type</span><div class="seg" id="f-opt"><button type="button" data-v="CE" class="on" onclick="setOpt('CE')">CE</button><button type="button" data-v="PE" onclick="setOpt('PE')">PE</button></div></div>
        <label class="field"><span>Strike price</span><input class="inp" id="f-strike" type="number" inputmode="decimal" step="any" placeholder="24,200"></label>
        <label class="field span2"><span>Expiry</span><input class="inp" id="f-expiry" type="date"></label></div>
    </div>
    <div class="fgroup"><div class="field"><span>Direction</span>
      <div class="seg dir" id="f-dir"><button type="button" data-v="Long" class="on" onclick="setDir('Long')">Buy / Long</button><button type="button" data-v="Short" onclick="setDir('Short')">Sell / Short</button></div></div></div>
    <div class="fg">
      <label class="field"><span>Entry price</span><input class="inp" id="f-entry" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00" oninput="calcLive()"></label>
      <label class="field"><span>Quantity</span><input class="inp" id="f-qty" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="calcLive()"></label>
      <label class="field"><span>Exit price <small>(blank = open)</small></span><input class="inp" id="f-exit" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00" oninput="calcLive()"></label>
      <label class="field"><span>Stop loss</span><input class="inp" id="f-stop" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00" oninput="calcLive()"></label>
      <label class="field"><span>Target</span><input class="inp" id="f-target" type="number" inputmode="decimal" step="any" min="0" placeholder="0.00" oninput="calcLive()"></label>
      <label class="field"><span>Strategy</span><select class="inp" id="f-strategy"></select></label>
      <label class="field"><span>Setup</span><select class="inp" id="f-setup"></select></label>
      <label class="field"><span>Timeframe</span><select class="inp" id="f-tf"></select></label>
      <label class="field"><span>Risk amount</span><input class="inp" id="f-risk" readonly placeholder="—"></label>
      <label class="field"><span>R : R ratio</span><input class="inp" id="f-rr" readonly placeholder="—"></label>
    </div>
    <div class="det">
      <div class="fg"><label class="field"><span>Brokerage / fees</span><input class="inp" id="f-fees" type="number" inputmode="decimal" step="any" min="0" placeholder="0" oninput="calcLive()"></label><div></div></div>
      <div class="fgroup"><label class="field"><span>Entry time</span><div class="with-btn"><input class="inp" id="f-entry-time" type="datetime-local"><button type="button" class="btn plain sm" onclick="setNow('f-entry-time')">Now</button></div></label></div>
      <div class="fgroup"><label class="field"><span>Exit time</span><div class="with-btn"><input class="inp" id="f-exit-time" type="datetime-local"><button type="button" class="btn plain sm" onclick="setNow('f-exit-time')">Now</button></div></label></div>
      <div class="fgroup"><div class="field"><span>Mistake made?</span></div><div class="wrap-chips" id="f-mistakes"></div></div>
      <div class="fgroup"><div class="field"><span>Execution rating</span></div><div class="stars" id="f-stars"></div></div>
      <div class="fgroup"><label class="field"><span>Notes</span><textarea class="inp" id="f-notes" placeholder="What was the plan? How did you feel?"></textarea></label></div>
    </div>
  </div>
  <div class="sheet-foot">
    <div class="live"><div><small id="calc-lbl">Net P&amp;L</small><b class="num" id="calc-net">0</b></div><div class="meta"><span class="num" id="calc-gross"></span><span class="num" id="calc-r"></span></div></div>
    <button class="btn primary block" id="tf-save" onclick="saveTrade()">Save Trade</button>
  </div>
</div>

<div class="sheet full" id="sheet-detail" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><button class="icon-btn" onclick="closeSheet()" aria-label="Back"><i data-ic="left"></i></button><h2 class="title-md grow">Trade Details</h2><button class="icon-btn" id="td-edit" aria-label="Edit"><i data-ic="edit"></i></button><button class="icon-btn" id="td-del" aria-label="Delete" style="color:var(--down)"><i data-ic="trash"></i></button></div>

<div class="sheet" id="sheet-cap" role="dialog" aria-modal="true">

  <div class="sheet-head"><h2 class="title-md grow" style="padding-left:6px">Capital entry</h2><button class="icon-btn" onclick="closeSheet()" aria-label="Close"><i data-ic="x"></i></button></div>
  <div class="sheet-body">
    <div class="wrap-chips" id="c-type"></div>
    <div class="fgroup" id="c-dirbox" style="display:none"><div class="seg" id="c-dir"><button type="button" data-v="toCash" onclick="setCapDir('toCash')">Trading → Cash</button><button type="button" data-v="toTrading" onclick="setCapDir('toTrading')">Cash → Trading</button></div></div>

    <div class="fgroup"><label class="field"><span>Note</span><input class="inp" id="c-notes" placeholder="Optional"></label></div>

  <div class="sheet-foot"><button class="btn primary block" onclick="saveCap()">Save entry</button></div>

<div class="sheet" id="sheet-gen" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><h2 class="title-md grow" id="gen-title" style="padding-left:6px"></h2><button class="icon-btn" onclick="closeSheet()" aria-label="Close"><i data-ic="x"></i></button></div>
  <div class="sheet-body" id="gen-body"></div>
</div>

<div class="sheet" id="sheet-print" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-head"><h2 class="title-md grow" style="padding-left:6px">Print &amp; PDF</h2><button class="icon-btn" onclick="closeSheet()" aria-label="Close"><i data-ic="x"></i></button></div>
  <div class="sheet-body" id="print-body"></div>
  <div class="sheet-foot"><button class="btn primary block" onclick="openPreview()"><i data-ic="eye"></i> Preview</button></div>

function hydrate(root=document){root.querySelectorAll('i[data-ic]').forEach(el=>{el.outerHTML=ic(el.dataset.ic,el.className)})}

/* ================= HELPERS ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(v);return Number.isFinite(x)?x:0};
const pad=x=>String(x).padStart(2,'0');
const localISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayKey=()=>localISO().slice(0,10);
const dayKey=t=>(t.entryTime||'').slice(0,10);
const cls=v=>v>0?'up':v<0?'down':'';
const cur=()=>S.settings.currency||'';
function money(v,{sign=false,dp='auto'}={}){
  let d=dp;if(dp==='auto')d=Math.abs(Math.round(v*100)%100)<1?0:2;
  const a=Math.abs(v);const s=a.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
  const neg=v<0&&Number(a.toFixed(d))!==0;return (neg?'-':(sign&&v>0?'+':''))+cur()+s;
}
function compact(v){
  const a=Math.abs(v);if(a<0.5)return '0';
  const t=(n,d)=>n.toFixed(d).replace(/\.0$/,'');let r;
  if(a>=1e7)r=t(a/1e7,a>=1e8?0:1)+'Cr';else if(a>=1e5)r=t(a/1e5,a>=1e6?0:1)+'L';else if(a>=1e3)r=t(a/1e3,a>=1e4?0:1)+'K';else r=a%1?a.toFixed(1):String(a);
  return (v<0?'-':'+')+r;
}
const axisFmt=v=>compact(v).replace('+','');
const pct=(v,dp=0)=>(v*100).toFixed(dp)+'%';
function fmtDay(k){const d=new Date(k+'T00:00');return isNaN(d)?k:d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
function fmtShort(s){const d=new Date(s);if(isNaN(d))return s||'—';return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(s){const d=new Date(s);if(isNaN(d))return s||'—';return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function fmtDur(m){if(!isFinite(m)||m<=0)return '—';if(m<60)return Math.round(m)+'m';if(m<1440)return Math.floor(m/60)+'h '+Math.round(m%60)+'m';return Math.floor(m/1440)+'d '+Math.floor((m%1440)/60)+'h'}
const holdMins=t=>{const m=(new Date(t.exitTime||t.entryTime)-new Date(t.entryTime))/60000;return isFinite(m)&&m>0?m:0};
const byTime=(a,b)=>new Date(a.entryTime)-new Date(b.entryTime);
const buzz=(ms=8)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function groupBy(list,fn){const m=new Map();list.forEach(t=>{const k=fn(t);if(k==null)return;if(!m.has(k))m.set(k,[]);m.get(k).push(t)});return m}
const isClosed=t=>t.exitPrice>0&&t.entryPrice>0;
const sumNet=l=>l.reduce((a,t)=>a+(isClosed(t)?t.netPnL:0),0);
const hash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const avColor=s=>PALETTE[hash(s)%PALETTE.length];
const initials=s=>(String(s).replace(/[^A-Za-z]/g,'').slice(0,2)||'?').toUpperCase();
function tradeName(t){
  let n=t.symbol;
  if(t.instrument==='Options')n+=(' '+(t.optType||'')+' '+(t.strike?t.strike.toLocaleString('en-IN'):'')).replace(/\s+$/,'');
  else if(t.instrument==='Futures')n+=' FUT';
  return n;
}
const pctMove=t=>t.entryPrice?((t.type==='Long'?t.exitPrice/t.entryPrice-1:1-t.exitPrice/t.entryPrice)*100):0;

/* ================= STATE ================= */
const clone=o=>JSON.parse(JSON.stringify(o));
function normTrade(t){
  const o={...t};
  o.id=t.id||('TRD-'+Date.now()+'-'+Math.floor(Math.random()*1000));
  o.symbol=String(t.symbol||'').toUpperCase();o.type=t.type==='Short'?'Short':'Long';
  ['qty','entryPrice','exitPrice','brokerage','grossPnL','netPnL','stopLoss','target','strike','rating'].forEach(k=>o[k]=num(t[k]));
  o.entryTime=String(t.entryTime||'');o.exitTime=String(t.exitTime||t.entryTime||'');
  o.notes=t.notes==null?'':String(t.notes);o.mistakes=t.mistakes||'None';o.setup=t.setup||'';
  o.exchange=t.exchange||'NSE';o.instrument=INSTRUMENTS.includes(t.instrument)?t.instrument:'Stocks';
  o.optType=t.optType==='PE'?'PE':'CE';o.expiry=t.expiry||'';o.strategy=t.strategy||'';o.timeframe=t.timeframe||'';
  return o;
}
const S={
  trades:[],capitalLogs:[],settings:clone(DEFAULT_SETTINGS),
  load(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return;const p=JSON.parse(raw);
    this.trades=Array.isArray(p.trades)?p.trades.map(normTrade):[];
    this.capitalLogs=Array.isArray(p.capitalLogs)?p.capitalLogs:[];
    const st=p.settings||{};const first=!st.uiv;
    this.settings={...clone(DEFAULT_SETTINGS),...st};
    this.settings.alerts={...DEFAULT_SETTINGS.alerts,...(st.alerts||{})};
    ['strategies','setups','mistakeList'].forEach(k=>{if(!Array.isArray(this.settings[k]))this.settings[k]=clone(DEFAULT_SETTINGS)[k]});
    if(first){this.settings.theme='light';this.settings.uiv=3;if(this.trades.length)this.settings.onboarded=true}
  }catch(e){console.error('load failed',e)}},
  save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({trades:this.trades,capitalLogs:this.capitalLogs,settings:this.settings}))}
    catch(e){toast('Could not save — storage is full or blocked')}},
  addTrade(o){o.id='TRD-'+Date.now()+'-'+Math.floor(Math.random()*1000);this.trades.push(normTrade(o));this.save()},
  updateTrade(id,f){const i=this.trades.findIndex(t=>t.id===id);if(i>-1){this.trades[i]=normTrade({...this.trades[i],...f,id});this.save()}},
  deleteTrade(id){this.trades=this.trades.filter(t=>t.id!==id);this.save()},
  addCap(o){o.id='CAP-'+Date.now()+'-'+Math.floor(Math.random()*1000);this.capitalLogs.push(o);this.save()},
  deleteCap(id){this.capitalLogs=this.capitalLogs.filter(c=>c.id!==id);this.save()}
};
function funding(){
  let dep=0,wd=0,fees=0,res=0;
  S.capitalLogs.forEach(c=>{const a=num(c.amount);switch(c.type){case 'Withdrawal':wd+=a;break;case 'Fees':fees+=a;break;case 'Transfer':res+=(c.dir==='toTrading'?-a:a);break;default:dep+=a}});
  return{dep,wd,fees,reserve:Math.max(0,res),net:dep-wd-fees};
}
const totalCapital=()=>funding().net+sumNet(S.trades);

function applyTheme(){
  const t=S.settings.theme;const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);

/* ================= PERIOD + STATS ================= */
let period={kind:'month',ym:null};
function weekStart(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d).slice(0,10)}
function inPeriod(t){
  if(!t.entryTime)return false;const k=dayKey(t),today=todayKey();
  switch(period.kind){
    case 'all':return true;case 'today':return k===today;case 'week':return k>=weekStart()&&k<=today;
    case 'month':return k.slice(0,7)===today.slice(0,7);case 'year':return k.slice(0,4)===today.slice(0,4);
    case 'custom':return k.slice(0,7)===period.ym;
  }return true;
}
function periodLabel(){
  switch(period.kind){case 'today':return 'Today';case 'week':return 'This week';case 'month':return 'This month';case 'year':return 'This year';
    case 'custom':{const[y,m]=(period.ym||'').split('-');return MONTHS[(+m||1)-1].slice(0,3)+' '+y}default:return 'All time'}
}
function setPeriodVal(v){period=v.startsWith('m:')?{kind:'custom',ym:v.slice(2)}:{kind:v,ym:null};render()}
function periodSel(){
  const base=[['today','Today'],['week','This Week'],['month','This Month'],['year','This Year'],['all','All Time']];
  const yms=[...new Set(S.trades.map(t=>dayKey(t).slice(0,7)).filter(Boolean))].sort().reverse().slice(0,12);
  const cv=period.kind==='custom'?'m:'+period.ym:period.kind;
  const opts=base.concat(yms.map(k=>['m:'+k,MONTHS[+k.slice(5,7)-1].slice(0,3)+' '+k.slice(0,4)]));
  if(period.kind==='custom'&&!yms.includes(period.ym))opts.push(['m:'+period.ym,periodLabel()]);
  return `<label class="pselect"><select onchange="setPeriodVal(this.value)" aria-label="Period">${opts.map(([v,l])=>`<option value="${v}" ${v===cv?'selected':''}>${l}</option>`).join('')}</select>${ic('chevd')}</label>`;
}
function stats(all){
  const list=all.filter(isClosed);
  const s={count:list.length,wins:0,losses:0,be:0,net:0,gross:0,fees:0,grossWin:0,grossLoss:0,best:null,worst:null,
    maxDD:0,streak:0,maxW:0,maxL:0,days:{},eq:[0],eqLabels:['Start'],holdSum:0};
  const sorted=[...list].sort(byTime);let eq=0,peak=0,run=0;
  sorted.forEach(t=>{
    const n=t.netPnL;s.net+=n;s.gross+=t.grossPnL;s.fees+=t.brokerage;s.holdSum+=holdMins(t);
    if(n>0){s.wins++;s.grossWin+=n;run=run>0?run+1:1}else if(n<0){s.losses++;s.grossLoss+=-n;run=run<0?run-1:-1}else{s.be++;run=0}
    s.maxW=Math.max(s.maxW,run);s.maxL=Math.max(s.maxL,-run);
    if(!s.best||n>s.best.netPnL)s.best=t;if(!s.worst||n<s.worst.netPnL)s.worst=t;
    eq+=n;peak=Math.max(peak,eq);s.maxDD=Math.max(s.maxDD,peak-eq);
    s.eq.push(+eq.toFixed(2));s.eqLabels.push(t.symbol);
    const k=dayKey(t);if(k)s.days[k]=(s.days[k]||0)+n;
  });
  s.streak=run;
  const dv=Object.entries(s.days);
  s.bestDay=dv.length?dv.reduce((a,b)=>b[1]>a[1]?b:a):null;
  s.worstDay=dv.length?dv.reduce((a,b)=>b[1]<a[1]?b:a):null;
  s.greenDays=dv.filter(d=>d[1]>0).length;s.redDays=dv.filter(d=>d[1]<0).length;
  const dec=s.wins+s.losses;
  s.winRate=dec?s.wins/dec:0;
  s.avgWin=s.wins?s.grossWin/s.wins:0;s.avgLoss=s.losses?s.grossLoss/s.losses:0;
  s.pf=s.grossLoss?s.grossWin/s.grossLoss:(s.grossWin>0?Infinity:0);
  s.expectancy=s.count?s.net/s.count:0;s.avgHold=s.count?s.holdSum/s.count:0;
  return s;
}

let pendingCharts=[],chartSeq=0;
function chartHost(fn,minH=150){const id='chb'+(++chartSeq);pendingCharts.push({id,fn});return `<div class="chartbox" id="${id}" style="min-height:${minH}px"></div>`}
function flushCharts(){pendingCharts.forEach(c=>{const el=document.getElementById(c.id);if(el)el.innerHTML=c.fn(Math.max(240,el.clientWidth||340))});pendingCharts=[]}
function niceScale(min,max,n=4){
  min=Math.min(min,0);max=Math.max(max,0);if(max===min)max=min+1;
  const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step;const t=[];
  for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(6));return{lo,hi,ticks:t};
}
function smoothPath(p){let d=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=1;i<p.length;i++){const[x0,y0]=p[i-1],[x1,y1]=p[i],cx=(x0+x1)/2;d+=` C${cx.toFixed(1)},${y0.toFixed(1)} ${cx.toFixed(1)},${y1.toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`}return d}
function lineChartSVG(vals,{w=340,h=170,color='var(--up)',tag=true}={}){
  if(vals.length<2)return `<div class="empty-state" style="padding:40px 0">No data for this range</div>`;
  const L=40,R=tag?64:12,T=12,B=10,sc=niceScale(Math.min(...vals),Math.max(...vals));const gid='g'+(++chartSeq);
  const X=i=>L+i/(vals.length-1)*(w-L-R),Y=v=>T+(1-(v-sc.lo)/(sc.hi-sc.lo))*(h-T-B);
  const pts=vals.map((v,i)=>[X(i),Y(v)]),d=smoothPath(pts);
  const grid=sc.ticks.map(t=>`<line x1="${L}" x2="${w-R+(tag?6:0)}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-7}" y="${Y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--faint)">${axisFmt(t)}</text>`).join('');
  const last=pts[pts.length-1],lv=vals[vals.length-1],lt=money(lv,{dp:0});
  const tw=lt.length*6.6+14;
  const tg=tag?`<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${color}"/><rect x="${last[0]+7}" y="${last[1]-10}" width="${tw}" height="20" rx="6" fill="${color}"/><text x="${last[0]+7+tw/2}" y="${last[1]+4}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">${lt}</text>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${d} L${X(vals.length-1)},${Y(sc.lo)} L${L},${Y(sc.lo)} Z" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round"/>${tg}</svg>`;
}
function barChartSVG(vals,labels,{w=340,h=170,fmt=axisFmt,color=v=>v>=0?'var(--up)':'var(--down)'}={}){
  if(!vals.length)return '';
  const L=40,R=8,T=10,B=22,sc=niceScale(Math.min(...vals,0),Math.max(...vals,0));
  const Y=v=>T+(1-(v-sc.lo)/(sc.hi-sc.lo))*(h-T-B),n=vals.length,slot=(w-L-R)/n,bw=Math.min(26,slot*.55),lstep=Math.max(1,Math.ceil((Math.max(...labels.map(l=>String(l).length))*5.8+6)/slot));
  const grid=sc.ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${L-7}" y="${Y(t)+3.5}" text-anchor="end" font-size="10" fill="var(--faint)">${fmt(t)}</text>`).join('');
  const bars=vals.map((v,i)=>{const x=L+slot*i+(slot-bw)/2,y0=Y(0),y1=Y(v),top=Math.min(y0,y1),ht=Math.max(1.5,Math.abs(y0-y1));
    return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${ht.toFixed(1)}" rx="3" fill="${color(v)}"/>${i%lstep===0?`<text x="${(x+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--faint)">${esc(labels[i])}</text>`:''}`}).join('');

}
function sparkSVG(v,color,w=160,h=64){
  if(v.length<2)return '';
  const P=4,mn=Math.min(...v),mx=Math.max(...v),r=(mx-mn)||1,gid='s'+(++chartSeq);
  const pts=v.map((y,i)=>[i/(v.length-1)*w,h-P-((y-mn)/r)*(h-P*2)]);const d=smoothPath(pts);

function barRows(rows,fmt=v=>money(v,{sign:true})){
  if(!rows.length)return '<p class="hint">No data yet.</p>';
  const mx=Math.max(...rows.map(r=>Math.abs(r.value)),1);
  return '<div class="brows">'+rows.map(r=>`<div class="brow"><div class="bl"><b>${esc(r.label)}</b><small>${esc(r.sub||'')}</small></div><div class="bt"><i class="${r.value>=0?'bu':'bd'}" style="width:${Math.max(3,Math.abs(r.value)/mx*100)}%;background:${r.value>=0?'var(--up)':'var(--down)'}"></i></div><div class="bv num ${cls(r.value)}">${fmt(r.value)}</div></div>`).join('')+'</div>';
}
function avgR(list){
  const w=list.filter(t=>isClosed(t)&&t.stopLoss>0&&Math.abs(t.entryPrice-t.stopLoss)>0);
  if(!w.length)return {v:null,n:0};
  return {v:w.reduce((a,t)=>a+((t.type==='Long'?t.exitPrice-t.entryPrice:t.entryPrice-t.exitPrice)/Math.abs(t.entryPrice-t.stopLoss)),0)/w.length,n:w.length};
}
function sumRowsOf(g,fmtL=k=>k){return [...g.entries()].map(([k,a])=>{const cl=a.filter(isClosed);return{label:fmtL(k),value:sumNet(a),sub:`${cl.length} trade${cl.length!==1?'s':''} · ${pct(stats(cl).winRate)}`}})}

/* ================= JOURNAL ================= */
const jState={f:'all',sort:'new',month:'',limit:60};
function renderJournal(){
  const FILTERS=[['all','All'],['open','Open'],['closed','Closed'],['today','Today'],['week','This Week'],['win','Wins'],['loss','Losses'],['Long','Long'],['Short','Short']];
  $('#j-chips').innerHTML=FILTERS.map(([k,l])=>`<button class="chip ${jState.f===k?'on':''}" onclick="jState.f='${k}';jState.limit=60;renderJournal()">${l}</button>`).join('')+
    `<input type="month" class="chip-input ${jState.month?'on':''}" value="${jState.month}" onchange="jState.month=this.value;jState.limit=60;renderJournal()" aria-label="Filter month">`+
    `<select class="chip-input" onchange="jState.sort=this.value;renderJournal()" aria-label="Sort">${[['new','Newest'],['old','Oldest'],['best','Best P&L'],['worst','Worst P&L']].map(([v,l])=>`<option value="${v}" ${jState.sort===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const q=($('#j-q').value||'').trim().toLowerCase();let list=[...S.trades];
  if(q)list=list.filter(t=>[t.symbol,tradeName(t),t.notes,t.setup,t.strategy,t.mistakes,t.instrument].join(' ').toLowerCase().includes(q));
  switch(jState.f){case 'open':list=list.filter(t=>!isClosed(t));break;case 'closed':list=list.filter(isClosed);break;
    case 'today':list=list.filter(t=>dayKey(t)===todayKey());break;case 'week':list=list.filter(t=>dayKey(t)>=weekStart());break;
    case 'win':list=list.filter(t=>isClosed(t)&&t.netPnL>0);break;case 'loss':list=list.filter(t=>isClosed(t)&&t.netPnL<0);break;
    case 'Long':case 'Short':list=list.filter(t=>t.type===jState.f)}
  if(jState.month)list=list.filter(t=>dayKey(t).slice(0,7)===jState.month);
  const box=$('#j-list');
  if(!list.length){box.innerHTML=S.trades.length?emptyState('search','No matches','Try a different search or filter.'):emptyState('book','Your journal is empty','Log your first trade to start building your edge.',`<button class="btn primary" onclick="openTradeForm()">${ic('plus')} Add trade</button>`);return}
  list.sort((a,b)=>jState.sort==='best'?b.netPnL-a.netPnL:jState.sort==='worst'?a.netPnL-b.netPnL:byTime(a,b));if(jState.sort==='new')list.reverse();
  const st=stats(list.filter(isClosed));
  let body='';
  const strip=`<div class="card sumstrip"><div><small>Trades</small><b class="num">${list.length}</b></div><div><small>Net P&amp;L</small><b class="num ${cls(st.net)}">${money(st.net,{sign:true})}</b></div><div><small>Win rate</small><b class="num">${pct(st.winRate)}</b></div></div>`;
  const shown=list.slice(0,jState.limit);
  if(jState.sort==='new'||jState.sort==='old'){
    const g=groupBy(shown,dayKey);
    g.forEach((arr,k)=>{const dn=sumNet(arr);body+=`<div class="day-head"><span>${fmtDay(k)}</span><span class="num ${cls(dn)}">${money(dn,{sign:true})}</span></div><div class="rowlist">${arr.map(tradeRow).join('')}</div>`});
  }else body=`<div class="rowlist" style="margin-top:12px">${shown.map(tradeRow).join('')}</div>`;
  box.innerHTML=strip+body+(list.length>jState.limit?`<button class="btn plain block" style="margin-top:14px" onclick="jState.limit+=60;renderJournal()">Show more (${list.length-jState.limit} left)</button>`:'');
}

/* ================= CALENDAR ================= */
const n0=new Date();const cal={y:n0.getFullYear(),m:n0.getMonth(),sel:todayKey()};
function calShift(d){cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}cal.sel=null;renderCalendar()}
function calPick(v){if(!v)return;const[y,m]=v.split('-');cal.y=+y;cal.m=+m-1;cal.sel=null;renderCalendar()}
function calSel(k){cal.sel=k;buzz(5);renderCalendar()}
function dayMap(){const m={};S.trades.filter(isClosed).forEach(t=>{const k=dayKey(t);if(k)m[k]=(m[k]||0)+t.netPnL});return m}
function calTxt(v){const a=Math.abs(v);return a<1000?(v<0?'-':'+')+a.toFixed(1):compact(v)}
function calToday(){const n=new Date();cal.y=n.getFullYear();cal.m=n.getMonth();cal.sel=todayKey();renderCalendar()}
function renderCalendar(){
  const el=$('#v-calendar'),dm=dayMap();
  let off=new Date(cal.y,cal.m,1).getDay()-1;if(off<0)off=6;
  const total=new Date(cal.y,cal.m+1,0).getDate(),today=todayKey(),ymKey=`${cal.y}-${pad(cal.m+1)}`;
  const mxAbs=Math.max(1,...Object.entries(dm).filter(([k])=>k.startsWith(ymKey)).map(([,v])=>Math.abs(v)));
  let cells='';for(let i=0;i<off;i++)cells+='<div class="cell empty"></div>';
  const weeks=[];let wk={n:0,c:0};
  for(let d=1;d<=total;d++){
    const k=`${ymKey}-${pad(d)}`,v=dm[k],sel=k===cal.sel,has=v!==undefined;
    if(has){wk.n+=v;wk.c++}
    if((off+d)%7===0||d===total){weeks.push({...wk,idx:weeks.length+1});wk={n:0,c:0}}
    let style='';
    if(has){const a=.16+.56*Math.min(1,Math.abs(v)/mxAbs);style=`background:${v>=0?`rgba(34,197,94,${a.toFixed(2)})`:`rgba(245,87,108,${a.toFixed(2)})`};${sel?'':'border-color:transparent;'}color:${a>.42?'#fff':'var(--text)'}`}
    cells+=`<button type="button" class="cell ${has?'has':''} ${k===today?'today':''} ${sel?'sel':''}" style="${style}" onclick="calSel('${k}')" aria-label="${k}${has?', '+calTxt(v):''}"><span class="d">${d}</span><span class="p num">${has?calTxt(v):''}</span></button>`;
  }
  const ms=stats(S.trades.filter(t=>dayKey(t).slice(0,7)===ymKey).filter(isClosed));
  let h=subHeader('Trading Calendar',`<button class="icon-btn box" onclick="calToday()" aria-label="Go to today">${ic('target')}</button><button class="icon-btn box" onclick="openPrint('calendar',{view:'month',ym:'${ymKey}'})" aria-label="Print calendar">${ic('print')}</button>`)+
    `<div class="cal-nav"><button class="icon-btn box" onclick="calShift(-1)" aria-label="Previous month">${ic('left')}</button>
      <div class="mt">${MONTHS[cal.m]} ${cal.y}<input type="month" value="${ymKey}" onchange="calPick(this.value)" aria-label="Pick month"></div>
      <button class="icon-btn box" onclick="calShift(1)" aria-label="Next month">${ic('right')}</button></div>
    <div class="cal-head">${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid" id="cal-grid">${cells}</div>`;
  if(cal.sel){
    const dl=S.trades.filter(t=>dayKey(t)===cal.sel).sort(byTime),ds=stats(dl.filter(isClosed));
    h+=`<div class="sec"><span>${new Date(cal.sel+'T00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><button class="link" onclick="openTradeForm(null,{date:'${cal.sel}'})">+ Add trade</button></div>
      <div class="card"><div class="grid3" style="text-align:center"><div><div class="muted sub">P&amp;L</div><b class="num ${cls(ds.net)}" style="font-size:18px">${money(ds.net,{sign:true})}</b></div><div><div class="muted sub">Trades</div><b class="num" style="font-size:18px">${dl.length}</b></div><div><div class="muted sub">Win rate</div><b class="num" style="font-size:18px">${pct(ds.winRate)}</b></div></div></div>
      ${dl.length?`<div class="rowlist" style="margin-top:12px">${dl.map(tradeRow).join('')}</div>`:'<p class="hint" style="text-align:center;margin-top:12px">No trades on this day.</p>'}`;
  }
  h+=`<div class="sec"><span>${MONTHS[cal.m]} summary</span></div><div class="grid2"><div class="kpi"><div class="l">Month P&amp;L</div><div class="v num ${cls(ms.net)}">${money(ms.net,{sign:true})}</div><div class="s">${ms.count} trades · ${pct(ms.winRate)} win</div></div><div class="kpi"><div class="l">Green / red days</div><div class="v num"><span class="up">${ms.greenDays}</span> / <span class="down">${ms.redDays}</span></div><div class="s">trading days</div></div></div>`;
  const wkRows=weeks.filter(w=>w.c);
  if(wkRows.length)h+=`<div class="sec small"><span>Weekly</span></div><div class="rowlist">${wkRows.map(w=>`<div class="wk-row"><div class="main"><b>Week ${w.idx}</b><small>${w.c} trading day${w.c>1?'s':''}</small></div><b class="num ${cls(w.n)}">${money(w.n,{sign:true})}</b></div>`).join('')}</div>`;
  h+=`<button class="btn soft block" style="margin-top:20px" onclick="openPrint('calendar',{view:'month',ym:'${ymKey}'})">${ic('print')} Print or save calendar</button>`;
  el.innerHTML=h;
  const g=$('#cal-grid');let x0=null;
  g.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
  g.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>60){buzz(5);calShift(dx<0?1:-1)}});
}

/* ================= RISK ================= */
let rkTab='size';const rk={dir:'Long',bal:'',risk:'',sl:'',entry:'',rr:'2'};
function setRk(t){rkTab=t;pendingCharts=[];renderRisk();flushCharts()}
function rkCalc(){
  const bal=num($('#rk-bal').value),rp=num($('#rk-risk').value),sl=num($('#rk-sl').value),en=num($('#rk-entry').value),rr=num($('#rk-rr').value)||0;
  Object.assign(rk,{bal:$('#rk-bal').value,risk:$('#rk-risk').value,sl:$('#rk-sl').value,entry:$('#rk-entry').value,rr:$('#rk-rr').value});
  const amt=bal*rp/100,qty=sl>0?Math.floor(amt/sl):0,sgn=rk.dir==='Long'?1:-1;
  $('#rk-qty').textContent=qty;$('#rk-amt').textContent=money(qty*sl)+' ('+rp+'%)';
  $('#rk-sp').innerHTML=en>0&&sl>0?`${(en-sgn*sl).toFixed(2)} <span class="down">(-${sl.toFixed(2)})</span>`:'—';
  $('#rk-tp').innerHTML=en>0&&sl>0&&rr>0?`${(en+sgn*sl*rr).toFixed(2)} <span class="up">(+${(sl*rr).toFixed(2)})</span>`:'—';
  $('#rk-rr2').textContent=sl>0&&rr>0?'1 : '+rr.toFixed(1):'—';
}
function setRkDir(d){rk.dir=d;$$('#rk-dir button').forEach(b=>b.classList.toggle('on',b.dataset.v===d));rkCalc()}
function setS(k,v){S.settings[k]=v;S.save();toast('Saved');render()}
function renderRisk(){

  let h=subHeader('Risk Management')+`<div class="tabs">${tabs.map(([k,l])=>`<button class="${rkTab===k?'on':''}" onclick="setRk('${k}')">${l}</button>`).join('')}</div>`;

    h+=`<div class="card"><b style="font-size:16px">Position Size Calculator</b>
      <div class="fgroup"><div class="seg dir" id="rk-dir"><button data-v="Long" class="${rk.dir==='Long'?'on':''}" onclick="setRkDir('Long')">Buy / Long</button><button data-v="Short" class="${rk.dir==='Short'?'on':''}" onclick="setRkDir('Short')">Sell / Short</button></div></div>
      <div class="fg"><label class="field"><span>Account balance</span><input class="inp" id="rk-bal" type="number" inputmode="decimal" value="${esc(rk.bal)}" oninput="rkCalc()"></label>
      <label class="field"><span>Risk per trade (%)</span><input class="inp" id="rk-risk" type="number" inputmode="decimal" step="any" value="${esc(rk.risk)}" oninput="rkCalc()"></label>
      <label class="field"><span>Stop loss (points)</span><input class="inp" id="rk-sl" type="number" inputmode="decimal" step="any" value="${esc(rk.sl)}" placeholder="15" oninput="rkCalc()"></label>
      <label class="field"><span>Entry price</span><input class="inp" id="rk-entry" type="number" inputmode="decimal" step="any" value="${esc(rk.entry)}" placeholder="125.50" oninput="rkCalc()"></label>
      <label class="field span2"><span>Reward : risk (target multiple)</span><input class="inp" id="rk-rr" type="number" inputmode="decimal" step="any" value="${esc(rk.rr)}" oninput="rkCalc()"></label></div>
      <div class="calc-res"><small>Position size (Qty)</small><b class="num" id="rk-qty">0</b><small style="margin-top:8px">Risk amount</small><b class="num" id="rk-amt" style="font-size:19px;color:var(--text)">—</b></div></div>
      <div class="card" style="margin-top:12px"><b style="font-size:16px">Planned Trade Summary</b><div style="margin:8px -16px 0"><div class="kv"><span>Stop loss</span><b class="num" id="rk-sp">—</b></div><div class="kv"><span>Target</span><b class="num" id="rk-tp">—</b></div><div class="kv"><span>Risk : Reward</span><b class="num" id="rk-rr2">—</b></div></div></div>
      <button class="btn primary block" style="margin-top:14px" onclick="rkCalc();toast('Calculated')">Calculate</button>`;
  }else if(rkTab==='limits'){

    const used=lim>0?Math.max(0,-net)/lim:0,tu=mx>0?today.length/mx:0;
    const bar=(p)=>`<div class="bar ${p>=1?'down':p>=.75?'warn':'up'}" style="margin-top:8px"><i style="width:${Math.min(100,p*100)}%"></i></div>`;
    h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Daily loss</b><span class="num muted">${lim>0?money(Math.max(0,-net))+' / '+money(lim):'Not set'}</span></div>${lim>0?bar(used):''}</div>
      <div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between"><b>Trades today</b><span class="num muted">${mx>0?today.length+' / '+mx:today.length+' (no limit)'}</span></div>${mx>0?bar(tu):''}</div>
      <div class="sec small"><span>Your limits</span></div><div class="card stack">
      <label class="field"><span>Risk per trade (% of capital)</span><input class="inp" type="number" inputmode="decimal" step="any" min="0" value="${S.settings.riskPerTrade}" onchange="setS('riskPerTrade',num(this.value))"></label>
      <label class="field"><span>Daily loss limit (0 = off)</span><input class="inp" type="number" inputmode="decimal" step="any" min="0" value="${S.settings.dailyLossLimit||0}" onchange="setS('dailyLossLimit',num(this.value))"></label>
      <label class="field"><span>Max trades per day (0 = off)</span><input class="inp" type="number" inputmode="numeric" min="0" value="${S.settings.maxTradesPerDay||0}" onchange="setS('maxTradesPerDay',Math.round(num(this.value)))"></label>
      <label class="field"><span>Monthly profit target (0 = off)</span><input class="inp" type="number" inputmode="decimal" step="any" min="0" value="${S.settings.monthlyTarget||0}" onchange="setS('monthlyTarget',num(this.value))"></label></div>
      <p class="hint">Warnings appear on your Dashboard and in the alerts bell.</p>`;
  }else{
    const closed=S.trades.filter(isClosed).sort(byTime);let eq=funding().net,peak=eq,mdd=0;const dd=[0];
    closed.forEach(t=>{eq+=t.netPnL;peak=Math.max(peak,eq);const d=eq-peak;mdd=Math.min(mdd,d);dd.push(+d.toFixed(2))});

    h+=`<div class="grid2"><div class="kpi"><div class="l">Current drawdown</div><div class="v num ${curDD<0?'down':''}">${money(curDD)}</div><div class="s">${peak>0?pct(Math.abs(curDD)/base,1):''} from peak</div></div>
      <div class="kpi"><div class="l">Max drawdown</div><div class="v num ${mdd<0?'down':''}">${money(mdd)}</div><div class="s">${peak>0?pct(Math.abs(mdd)/base,1):''} of peak</div></div>
      <div class="kpi"><div class="l">Peak equity</div><div class="v num">${money(peak)}</div></div><div class="kpi"><div class="l">Equity now</div><div class="v num">${money(eq)}</div></div></div>
      <div class="card" style="margin-top:12px"><b style="font-size:15px">Drawdown curve</b><div style="margin-top:8px">${closed.length>1?chartHost(w=>lineChartSVG(dd,{w,h:170,color:'var(--down)',tag:false}),170):'<p class="hint">Log at least 2 closed trades to see the curve.</p>'}</div></div>`;
  }
  $('#v-risk').innerHTML=h;if(rkTab==='size')rkCalc();
}

const tf={dir:'Long',opt:'CE',mode:'quick',mistake:'None',rating:0};
function fillSel(id,items,cur,blank){$(id).innerHTML=(blank?`<option value="">${blank}</option>`:'')+items.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')}
function setDir(d){tf.dir=d;$$('#f-dir button').forEach(b=>b.classList.toggle('on',b.dataset.v===d));calcLive()}

function setNow(id){$('#'+id).value=localISO();calcLive()}

function openTradeForm(id=null,preset={}){
  const t=id?S.trades.find(x=>x.id===id):null,s=S.settings,src=t||preset;
  $('#tf-title').textContent=t?`Edit ${t.symbol}`:'New Trade';$('#f-id').value=t?t.id:'';

  fillSel('#f-exchange',EXCHANGES,src.exchange||s.defaultExchange);
  fillSel('#f-instrument',INSTRUMENTS,src.instrument||s.defaultInstrument);
  fillSel('#f-strategy',s.strategies,src.strategy||'','— None —');
  fillSel('#f-setup',[...new Set([...s.setups,...(src.setup?[src.setup]:[])])],src.setup||'','— None —');
  fillSel('#f-tf',TIMEFRAMES,src.timeframe||s.defaultTimeframe);
  if(t&&t.strategy&&!s.strategies.includes(t.strategy))$('#f-strategy').insertAdjacentHTML('beforeend',`<option selected>${esc(t.strategy)}</option>`);
  $('#f-strike').value=t&&t.strike?t.strike:(src.strike||'');$('#f-expiry').value=t?t.expiry:(src.expiry||'');
  $('#f-qty').value=t?t.qty:(src.qty||'');$('#f-entry').value=t?t.entryPrice:'';$('#f-exit').value=t&&t.exitPrice?t.exitPrice:'';
  $('#f-stop').value=t&&t.stopLoss?t.stopLoss:'';$('#f-target').value=t&&t.target?t.target:'';
  $('#f-fees').value=t?t.brokerage:(src.brokerage!=null?src.brokerage:s.defaultBrokerage);
  const nowT=localISO(),base=preset.date?preset.date+nowT.slice(10):nowT;
  $('#f-entry-time').value=t?t.entryTime:base;$('#f-exit-time').value=t?t.exitTime:base;$('#f-notes').value=t?t.notes:'';
  const recent=[...new Set([...S.trades].sort((a,b)=>byTime(b,a)).map(x=>x.symbol))].slice(0,7);
  $('#f-recent').innerHTML=t?'':recent.map(x=>`<button type="button" class="chip" onclick="pickSymbol('${esc(x)}')">${esc(x)}</button>`).join('');
  setDir(tf.dir);setOpt(tf.opt);setMode(t?'detailed':'quick');syncInstrument();paintForm();calcLive();
  $('#tf-save').textContent=t?'Save Changes':'Save Trade';

}
function pickSymbol(sym){
  $('#f-symbol').value=sym;const last=[...S.trades].sort((a,b)=>byTime(b,a)).find(t=>t.symbol===sym);
  if(last&&!$('#f-id').value){$('#f-instrument').value=last.instrument;$('#f-exchange').value=last.exchange;syncInstrument();tf.dir=last.type;setDir(tf.dir);if(!$('#f-qty').value)$('#f-qty').value=last.qty}
}
function calcLive(){
  const qty=num($('#f-qty').value),en=num($('#f-entry').value),ex=num($('#f-exit').value),fee=num($('#f-fees').value),sl=num($('#f-stop').value),tg=num($('#f-target').value);
  const closed=qty>0&&en>0&&ex>0;const gross=closed?((tf.dir==='Long'?ex-en:en-ex)*qty):0;const net=closed?gross-fee:0;
  const nb=$('#calc-net');$('#calc-lbl').textContent=closed?'Net P&L':(en>0&&qty>0?'Open trade':'Net P&L');
  nb.textContent=closed?money(net,{sign:true}):(en>0&&qty>0?'—':money(0));nb.className='num '+(closed?cls(net):'');
  $('#calc-gross').textContent=closed?`Gross ${money(gross,{sign:true})} · Fees ${money(fee)}`:'';
  const risk=(sl>0&&en>0&&qty>0)?Math.abs(en-sl)*qty:0,cap=totalCapital();
  $('#f-risk').value=risk>0?money(risk)+(cap>0?` (${(risk/cap*100).toFixed(1)}%)`:''):'';
  const rr=(risk>0&&tg>0)?Math.abs(tg-en)/Math.abs(en-sl):0;$('#f-rr').value=rr>0?'1 : '+rr.toFixed(1):'';
  let r='';if(closed&&sl>0&&sl!==en){const R=(tf.dir==='Long'?ex-en:en-ex)/Math.abs(en-sl);r=`${R>=0?'+':''}${R.toFixed(2)}R`}$('#calc-r').textContent=r;
  return{gross,net,qty,en,ex,fee,sl,tg,closed};
}
function saveTrade(){
  const c=calcLive(),sym=$('#f-symbol').value.trim().toUpperCase(),id=$('#f-id').value,eT=$('#f-entry-time').value;
  if(!sym)return toast('Enter a symbol');
  if(!(c.qty>0))return toast('Quantity must be greater than 0');
  if(!(c.en>0))return toast('Enter the entry price');
  if(!eT)return toast('Pick an entry time (Detailed Entry)');
  const inst=$('#f-instrument').value;
  const payload={symbol:sym,exchange:$('#f-exchange').value,instrument:inst,optType:tf.opt,strike:inst==='Options'?num($('#f-strike').value):0,expiry:inst==='Options'?$('#f-expiry').value:'',
    type:tf.dir,qty:c.qty,entryPrice:c.en,exitPrice:c.ex,brokerage:c.closed?c.fee:c.fee,stopLoss:c.sl,target:c.tg,strategy:$('#f-strategy').value,setup:$('#f-setup').value,timeframe:$('#f-tf').value,
    grossPnL:+c.gross.toFixed(2),netPnL:+c.net.toFixed(2),entryTime:eT,exitTime:$('#f-exit-time').value||eT,notes:$('#f-notes').value.trim(),mistakes:tf.mistake||'None',rating:tf.rating};
  if(id)S.updateTrade(id,payload);else S.addTrade(payload);
  buzz(15);closeSheet(()=>{toast((id?'Trade updated':'Trade saved')+(c.closed?' · '+money(c.net,{sign:true}):' · open'));render()});
}

/* ================= TRADE DETAIL ================= */
let dId=null,dtab='overview';
function openDetail(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return;dId=id;dtab='overview';
  $('#td-edit').onclick=()=>openTradeForm(id);$('#td-del').onclick=()=>delTrade(id);renderDetail();openSheet('detail');$('#td-body').scrollTop=0;
}
function setDtab(t){dtab=t;renderDetail()}
function ladder(t){
  const lv=[{k:'SL',v:t.stopLoss,c:'var(--down)'},{k:'Entry',v:t.entryPrice,c:'var(--brand)'},{k:'Target',v:t.target,c:'var(--up)'},{k:'Exit',v:t.exitPrice,c:t.netPnL>=0?'var(--up)':'var(--down)'}].filter(x=>x.v>0);
  const mn=Math.min(...lv.map(x=>x.v)),mx=Math.max(...lv.map(x=>x.v));if(mx<=mn||lv.length<2)return '';
  const P=v=>4+(v-mn)/(mx-mn)*92;lv.sort((a,b)=>a.v-b.v);
  const en=P(t.entryPrice),ex=t.exitPrice>0?P(t.exitPrice):en;
  return `<div style="position:relative;height:74px;margin:6px 14px 0"><div style="position:absolute;left:0;right:0;top:30px;height:4px;border-radius:4px;background:var(--surface2)"></div>
    <div style="position:absolute;left:${Math.min(en,ex)}%;width:${Math.abs(ex-en)}%;top:30px;height:4px;border-radius:4px;background:${t.netPnL>=0?'var(--up)':'var(--down)'}"></div>
    ${lv.map((x,i)=>`<i style="position:absolute;left:${P(x.v)}%;top:25px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:${x.c};border:3px solid var(--surface)"></i>
    <div style="position:absolute;left:${P(x.v)}%;top:${i%2?42:-2}px;transform:translateX(-50%);text-align:center;font-size:10px;line-height:1.25;color:var(--muted);font-weight:700;white-space:nowrap">${x.k}<br><span class="num" style="color:var(--text)">${x.v}</span></div>`).join('')}</div>`;
}
function renderDetail(){
  const t=S.trades.find(x=>x.id===dId);if(!t)return;
  const open=!isClosed(t),pc=pctMove(t),col=INST_COLOR[t.instrument]||'var(--muted)';
  const R=!open&&t.stopLoss>0&&t.stopLoss!==t.entryPrice?(t.type==='Long'?t.exitPrice-t.entryPrice:t.entryPrice-t.exitPrice)/Math.abs(t.entryPrice-t.stopLoss):null;
  const risk=t.stopLoss>0?Math.abs(t.entryPrice-t.stopLoss)*t.qty:0,rr=risk>0&&t.target>0?Math.abs(t.target-t.entryPrice)/Math.abs(t.entryPrice-t.stopLoss):0;

  else if(r==='last'){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);const yy=d.getFullYear(),mm=d.getMonth()+1;from=`${yy}-${pad(mm)}-01`;to=`${yy}-${pad(mm)}-31`;label=MONTHS[mm-1]+' '+yy}

    label=(pr.from?fmtDay(pr.from):'Start')+' → '+(pr.to?fmtDay(pr.to):'Today')}

function pvGather(){
  const doc=$('#pv-frame').contentDocument,root=doc&&doc.querySelector('.pd');if(!root){pvC=[];return}

function pvSim(){
  const br=[];let si=0,sy=pvMp;
  for(let i=1;i<pvC.length;i++){
    const c=pvC[i];let k=null;
    if(pvBreaks.has(i)&&!c.nb)k='f';else if(c.bottom-sy>pvCH+.5)k='n';
    if(!k)continue;
    let at=i;if(k==='n'&&c.nb&&i-1>si)at=i-1;
    const lim=pvLimit(si,sy);
    br.push({idx:at,forced:k==='f',prev:si,limit:lim.i,nat:lim.nat});
    si=at;sy=pvC[at].top-pvC[at].th;i=at;
  }
  return br;
}
function pvRedraw(){
  pvSimBr=pvSim();const n=pvSimBr.length+1,dm=pvCur.dims;
  $('#pv-guides').innerHTML=pvSimBr.map((b,i)=>`<div class="pvg ${b.forced?'f':''}" data-n="${i}" style="top:${(pvC[b.idx].top-pvC[b.idx].th-PV_GAP)*pvSc}px"><span class="ln"></span><button type="button" class="pvh" aria-label="Move page break ${i+2}">⇅ Page ${i+2}</button></div>`).join('');
  $('#pv-meta').textContent=`${dm.o==='landscape'?'Landscape':'Portrait'} · ${pr.paper} · ${n} page${n>1?'s':''}${n>1?' · drag ⇅ to adjust':''}`;
  $('#pv-opts').innerHTML=pvOptsHTML();
}
function pvApplyBreaks(){
  const doc=$('#pv-frame').contentDocument,st=doc&&doc.getElementById('fbstyle');if(st)st.textContent=prBreakCSS();
  pvRedraw();
}
(function(){
  const host=()=>$('#pv-guides');
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest&&e.target.closest('.pvg .pvh');if(!h)return;
    const g=h.parentNode,b=pvSimBr[+g.dataset.n];if(!b)return;
    pvDrag={g,b,j:b.idx,id:e.pointerId};h.setPointerCapture(e.pointerId);g.classList.add('drag');e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{
    if(!pvDrag||e.pointerId!==pvDrag.id)return;
    const r=$('#pv-wrap').getBoundingClientRect(),y=(e.clientY-r.top)/pvSc,b=pvDrag.b;
    let best=b.idx,bd=1e9;
    for(let i=b.prev+1;i<=b.limit;i++){if(pvC[i].nb)continue;const d=Math.abs(pvC[i].top-pvC[i].th-y);if(d<bd){bd=d;best=i}}
    pvDrag.j=best;pvDrag.g.style.top=(pvC[best].top-pvC[best].th-PV_GAP)*pvSc+'px';
    const sr=$('#pv-scroll').getBoundingClientRect(),sb=$('#pv-scroll');
    if(e.clientY<sr.top+56)sb.scrollTop-=14;else if(e.clientY>sr.bottom-56)sb.scrollTop+=14;
  });
  const end=e=>{
    if(!pvDrag||e.pointerId!==pvDrag.id)return;
    const{b,j}=pvDrag;pvDrag=null;
    if(j!==b.idx){
      pvBreaks.delete(b.idx);
      if(!(b.nat&&j===b.limit))pvBreaks.add(j);
      buzz&&buzz(8);
    }
    pvApplyBreaks();
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();

}
function prPDF(){
  if(typeof html2pdf==='undefined'){toast('PDF engine needs internet — use Print → Save as PDF');return}
  const d=pvCur,dm=d.dims,el=document.createElement('div');
  el.style.cssText=`width:${Math.round(dm.cw)}px;background:#fff`;el.innerHTML=`<style>${PDCSS(dm)}${prBreakCSS()}</style>${d.body}`;
  toast('Building PDF…',{ms:2000});
  pdfSave(el,{margin:dm.m,filename:d.fname,image:{type:'jpeg',quality:.98},html2canvas:{scale:2,backgroundColor:'#ffffff',windowWidth:Math.round(dm.cw)},
    jsPDF:{unit:'mm',format:pr.paper==='Letter'?'letter':'a4',orientation:dm.o},pagebreak:{mode:['css','legacy'],before:[...pvBreaks].map(i=>`[data-bk="${i}"]`),avoid:['.blk','tr','.k','.cc']}}).then(()=>toast('PDF saved'));
}

/* ---------- chart primitives (print-safe: fixed colours, true pixel widths) ---------- */
function pLine(vals,{w=500,h=150,color=P_BR,xl=null}={}){
  if(vals.length<2)return '<div class="nodata">Not enough data yet</div>';
  const Lm=46,Rm=60,T=12,B=xl?20:8,sc=niceScale(Math.min(...vals),Math.max(...vals));
  const X=i=>Lm+i/(vals.length-1)*(w-Lm-Rm),Y=v=>T+(1-(v-sc.lo)/(sc.hi-sc.lo))*(h-T-B);
  const pts=vals.map((v,i)=>[X(i),Y(v)]),d=smoothPath(pts);
  const grid=sc.ticks.map(t=>`<line x1="${Lm}" x2="${w-Rm+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#e2e8f0" stroke-dasharray="3 3"/><text x="${Lm-6}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#64748b">${axisFmt(t)}</text>`).join('');
  const last=pts[pts.length-1],lt=money(vals[vals.length-1],{dp:0}),tw=lt.length*6+12;
  const xs=xl?`<text x="${Lm}" y="${h-4}" font-size="9" fill="#64748b">${esc(xl[0])}</text><text x="${w-Rm+6}" y="${h-4}" text-anchor="end" font-size="9" fill="#64748b">${esc(xl[1])}</text>`:'';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${grid}<path d="${d} L${X(vals.length-1).toFixed(1)},${Y(sc.lo).toFixed(1)} L${Lm},${Y(sc.lo).toFixed(1)} Z" fill="${color}" fill-opacity=".10"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/><rect x="${(last[0]+7).toFixed(1)}" y="${(last[1]-9).toFixed(1)}" width="${tw}" height="18" rx="5" fill="${color}"/><text x="${(last[0]+7+tw/2).toFixed(1)}" y="${(last[1]+3.5).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff">${lt}</text>${xs}</svg>`;
}
function pBars(vals,labels,{w=500,h=150,vlab=true}={}){
  if(!vals.length)return '<div class="nodata">No data yet</div>';
  const Lm=46,Rm=8,T=14,B=22,sc=niceScale(Math.min(...vals,0),Math.max(...vals,0));
  const Y=v=>T+(1-(v-sc.lo)/(sc.hi-sc.lo))*(h-T-B),n=vals.length,slot=(w-Lm-Rm)/n,bw=Math.max(2,Math.min(30,slot*.62));
  const maxLen=Math.max(...labels.map(l=>String(l).length)),step=Math.max(1,Math.ceil((maxLen*5.6+6)/slot));
  const grid=sc.ticks.map(t=>`<line x1="${Lm}" x2="${w-Rm}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#e2e8f0" stroke-dasharray="3 3"/><text x="${Lm-6}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#64748b">${axisFmt(t)}</text>`).join('');
  const bars=vals.map((v,i)=>{const x=Lm+slot*i+(slot-bw)/2,y0=Y(0),y1=Y(v),top=Math.min(y0,y1),ht=Math.max(1.5,Math.abs(y0-y1));
    const val=vlab&&n<=12&&slot>=34?`<text x="${(x+bw/2).toFixed(1)}" y="${(v>=0?top-3:top+ht+9).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="${v>=0?P_UP:P_DN}">${axisFmt(v)}</text>`:'';
    return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${ht.toFixed(1)}" rx="2" fill="${v>=0?P_UP:P_DN}"/>${val}${i%step===0?`<text x="${(x+bw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9" fill="#64748b">${esc(labels[i])}</text>`:''}`}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${grid}${bars}</svg>`;
}
function pDonut(parts,{size=110,sw=16,center='',sub=''}={}){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1,r=(size-sw)/2,c=2*Math.PI*r,h=size/2;let off=0;
  const arcs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/tot*c,s=`<circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="flex:none"><circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="#eef2f7" stroke-width="${sw}"/>${arcs}<text x="${h}" y="${h+(sub?1:6)}" text-anchor="middle" font-size="${size*.2}" font-weight="800" fill="#0f172a">${center}</text>${sub?`<text x="${h}" y="${h+size*.15}" text-anchor="middle" font-size="${size*.085}" font-weight="700" fill="#64748b">${sub}</text>`:''}</svg>`;
}
function pHBars(rows,fmt=v=>money(v,{sign:true})){
  if(!rows.length)return '<div class="nodata">No data yet</div>';
  const mx=Math.max(...rows.map(r=>Math.abs(r.val)),1);
  return rows.map(r=>`<div class="hb"><div class="hl"><b>${esc(r.label)}</b><small>${esc(r.sub||'')}</small></div><div class="ht"><i style="width:${Math.max(2,Math.abs(r.val)/mx*100).toFixed(1)}%;background:${r.val>=0?P_UP:P_DN}"></i></div><div class="hv ${r.val>=0?'up':'dn'}">${fmt(r.val)}</div></div>`).join('');
}
function pTable(heads,rows,{align=[],foot=null}={}){
  const cell=(c,i,t)=>`<${t} class="${align[i]||''}">${c}</${t}>`;
  return `<table><thead><tr>${heads.map((h,i)=>cell(h,i,'th')).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>cell(c,i,'td')).join('')}</tr>`).join('')}</tbody>${foot?`<tfoot><tr>${foot.map((c,i)=>cell(c,i,'td')).join('')}</tr></tfoot>`:''}</table>`;
}

/* ---------- section builders ---------- */
function sKpi(c,n=12){
  const st=c.st,ret=c.f.net>0?st.net/c.f.net:null,open=c.list.length-st.count;
  return `<div class="kpis">${[
    kcard('Net P&L',px_(st.net,1),ret!=null?`${ret>=0?'+':''}${(ret*100).toFixed(1)}% on capital`:esc(c.R.label),pc_(st.net)),
    kcard('Win rate',pct(st.winRate),`${st.wins}W · ${st.losses}L${st.be?` · ${st.be}BE`:''}`),
    kcard('Profit factor',st.pf===Infinity?'∞':st.pf.toFixed(2),'gross win ÷ gross loss'),
    kcard('Expectancy',px_(st.expectancy,1),'per trade',pc_(st.expectancy)),
    kcard('Closed trades',st.count,open>0?`${open} still open`:'all closed'),
    kcard('Avg win',px_(st.avgWin),'','up'),
    kcard('Avg loss',px_(-st.avgLoss),'','dn'),
    kcard('Max drawdown',px_(-st.maxDD),'peak to trough',st.maxDD?'dn':''),
    kcard('Best trade',st.best?px_(st.best.netPnL,1):'—',st.best?esc(tradeName(st.best)):'','up'),
    kcard('Worst trade',st.worst&&st.worst.netPnL<0?px_(st.worst.netPnL,1):'—',st.worst&&st.worst.netPnL<0?esc(tradeName(st.worst)):'','dn'),
    kcard('Fees paid',px_(st.fees),st.gross>0?pct(st.fees/st.gross,1)+' of gross':''),
    kcard('Streak',st.streak>0?st.streak+' W':st.streak<0?(-st.streak)+' L':'—',`best ${st.maxW}W · worst ${st.maxL}L`,pc_(st.streak))
  ].slice(0,n).join('')}</div>`;
}
function sEquity(c,w,h=150){const st=c.st,ks=Object.keys(st.days).sort();

}

  openGen('Import Data',`<div class="stack"><p class="muted" style="font-size:13px">Import trades from a CSV using the template — or re-import a CSV exported from this app. Open trades are supported (leave ExitPrice blank).</p>
    <div class="btn-row"><button class="btn soft" onclick="csvTemplate()">${ic('download')} Template</button><button class="btn primary" onclick="$('#file-csv').click()">${ic('upload')} Import CSV</button></div>
    <button class="btn plain block" onclick="$('#file-json').click()">${ic('upload')} Restore a JSON backup</button></div>`);
}
function download(name,text,mime='text/csv'){
  const b=new Blob([text],{type:mime+';charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const CSV_HEAD=['ID','Entry_Timestamp','Exit_Timestamp','Ticker_Symbol','Exchange','Instrument','Direction_Type','Opt_Type','Strike','Expiry','Quantity_Size','Entry_Price','Exit_Price','Stop_Loss','Target','Brokerage_Fees','Gross_PnL','Net_PnL','Strategy','Setup','Timeframe','Pitfalls','Rating','Execution_Notes'];
function exportCSV(mode){
  let l=[...S.trades];
  if(mode==='month'){const m=$('#csv-month').value;if(!m)return toast('Select a month');l=l.filter(t=>t.entryTime.startsWith(m))}
  if(mode==='year'){const y=$('#csv-year').value;l=l.filter(t=>t.entryTime.startsWith(y))}
  if(!l.length)return toast('No trades in that range');
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=l.sort(byTime).map(t=>[t.id,t.entryTime,t.exitTime,t.symbol,t.exchange,t.instrument,t.type,t.optType,t.strike||'',t.expiry,t.qty,t.entryPrice,t.exitPrice||'',t.stopLoss||'',t.target||'',t.brokerage,t.grossPnL,t.netPnL,t.strategy,t.setup,t.timeframe,t.mistakes,t.rating||'',t.notes].map(q).join(','));
  download(`Trades_${mode}_${todayKey()}.csv`,[CSV_HEAD.join(','),...rows].join('\n'));toast(`Exported ${l.length} trades`);
}
function csvTemplate(){download('QuantumTrade_CSV_Template.csv',"Symbol,Direction,Quantity,EntryPrice,ExitPrice,Brokerage,EntryTime,ExitTime,Notes,Mistake,Instrument,Exchange,Strategy\nNIFTY,Long,50,22100.50,22150.00,40,2026-06-15T09:15,2026-06-15T09:20,Good trade,None,Options,NSE,Breakout")}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows;
}
function normDT(s){s=String(s||'').trim().replace(' ','T');if(s.length===10)s+='T00:00';return s.slice(0,16)}
function importCSV(e){
  const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{
    const rows=parseCSV(r.result);if(rows.length<2)return toast('File is empty or has only headers');
    const A={symbol:['symbol','ticker_symbol'],dir:['direction','direction_type','type'],qty:['quantity','quantity_size','qty'],en:['entryprice','entry_price'],ex:['exitprice','exit_price'],
      fee:['brokerage','brokerage_fees','fees'],et:['entrytime','entry_timestamp'],xt:['exittime','exit_timestamp'],notes:['notes','execution_notes'],mis:['mistake','pitfalls','mistakes'],
      sl:['stop_loss','stoploss'],tg:['target'],setup:['setup'],rating:['rating'],id:['id'],inst:['instrument'],exch:['exchange'],opt:['opt_type','opttype'],strike:['strike'],expiry:['expiry'],strat:['strategy'],tfm:['timeframe']};
    const head=rows[0].map(h=>h.trim().toLowerCase()),idx={};
    Object.entries(A).forEach(([k,names])=>{idx[k]=head.findIndex(h=>names.includes(h))});
    if(idx.symbol<0)['symbol','dir','qty','en','ex','fee','et','xt','notes','mis'].forEach((k,i)=>idx[k]=i);
    const g=(c,k)=>idx[k]>=0?(c[idx[k]]||'').trim():'';
    const have=new Set(S.trades.map(t=>t.id));let n=0,skip=0;
    rows.slice(1).forEach(c=>{
      const sym=g(c,'symbol').toUpperCase(),et=normDT(g(c,'et'));
      if(!sym||!et||isNaN(new Date(et))){skip++;return}
      const id=g(c,'id');if(id&&have.has(id)){skip++;return}
      const type=/^(short|sell)$/i.test(g(c,'dir'))?'Short':'Long';
      const qty=num(g(c,'qty')),en=num(g(c,'en')),ex=num(g(c,'ex')),fee=num(g(c,'fee'));
      const ok=qty>0&&en>0&&ex>0,gross=ok?((type==='Long'?ex-en:en-ex)*qty):0;
      S.addTrade({symbol:sym,type,qty,entryPrice:en,exitPrice:ex,brokerage:fee,grossPnL:+gross.toFixed(2),netPnL:ok?+(gross-fee).toFixed(2):0,entryTime:et,exitTime:normDT(g(c,'xt'))||et,
        notes:g(c,'notes')||'Imported from CSV',mistakes:g(c,'mis')||'None',stopLoss:num(g(c,'sl')),target:num(g(c,'tg')),setup:g(c,'setup'),rating:num(g(c,'rating')),
        instrument:g(c,'inst'),exchange:g(c,'exch')||S.settings.defaultExchange,optType:g(c,'opt'),strike:num(g(c,'strike')),expiry:g(c,'expiry'),strategy:g(c,'strat'),timeframe:g(c,'tfm')});n++;
    });
    toast(`Imported ${n} trade${n!==1?'s':''}${skip?` · skipped ${skip}`:''}`);closeSheet(()=>render());
  }catch(err){console.error(err);toast('Could not read that CSV file')}};
  r.readAsText(file);e.target.value='';
}
function validateData(){
  const issues=[],ids=new Map();
  S.trades.forEach(t=>{ids.set(t.id,(ids.get(t.id)||0)+1)});
  const dup=[...ids.values()].filter(v=>v>1).length;if(dup)issues.push({k:'dup',t:`${dup} duplicate trade ID${dup>1?'s':''}`});
  const badDate=S.trades.filter(t=>!t.entryTime||isNaN(new Date(t.entryTime))).length;if(badDate)issues.push({k:'date',t:`${badDate} trade${badDate>1?'s':''} with an invalid entry time`});
  const badQty=S.trades.filter(t=>!(t.qty>0)||!(t.entryPrice>0)).length;if(badQty)issues.push({k:'qty',t:`${badQty} trade${badQty>1?'s':''} with zero quantity or entry price`});
  const mism=S.trades.filter(t=>{if(!isClosed(t))return false;const g=(t.type==='Long'?t.exitPrice-t.entryPrice:t.entryPrice-t.exitPrice)*t.qty;return Math.abs(g-t.grossPnL)>0.01||Math.abs(g-t.brokerage-t.netPnL)>0.01}).length;
  if(mism)issues.push({k:'pnl',t:`${mism} trade${mism>1?'s':''} whose P&L doesn’t match prices`,fix:true});
  const stale=S.trades.filter(t=>!isClosed(t)&&(Date.now()-new Date(t.entryTime))>7*864e5).length;if(stale)issues.push({k:'stale',t:`${stale} open trade${stale>1?'s':''} older than 7 days`});
  const badCap=S.capitalLogs.filter(c=>!(num(c.amount)>0)).length;if(badCap)issues.push({k:'cap',t:`${badCap} capital entr${badCap>1?'ies':'y'} with no amount`});
  return issues;
}
function runValidation(){
  const is=validateData();
  openGen('Data Validation',is.length?`<p class="muted" style="font-size:13px;margin-bottom:10px">Checked ${S.trades.length} trades and ${S.capitalLogs.length} capital entries.</p><div class="rowlist">${is.map(i=>`<div class="row"><div class="ico c-amber">${ic('alert')}</div><div class="main"><div class="t" style="white-space:normal">${esc(i.t)}</div></div></div>`).join('')}</div>${is.some(i=>i.fix)?`<button class="btn primary block" style="margin-top:14px" onclick="fixPnL()">Recalculate P&amp;L from prices</button>`:''}`
    :emptyState('check','All good','No integrity issues found in your data.'));
}
function fixPnL(){
  S.trades=S.trades.map(t=>{if(!isClosed(t))return t;const g=(t.type==='Long'?t.exitPrice-t.entryPrice:t.entryPrice-t.exitPrice)*t.qty;return{...t,grossPnL:+g.toFixed(2),netPnL:+(g-t.brokerage).toFixed(2)}});
  S.save();toast('P&L recalculated');runValidation();render();
}

/* ---- backup ---- */
function cloudCreds(){return{key:S.settings.cloudKey||CLOUD_DEFAULT.key,bin:S.settings.cloudBin||CLOUD_DEFAULT.bin}}
async function pushCloud(){
  const c=cloudCreds();if(!c.key||!c.bin)return toast('Add your JSONBin key and bin ID first');
  if(!await ask({title:'Back up to cloud?',msg:'This overwrites your previous cloud backup.',ok:'Back up'}))return;
  try{const res=await fetch(`https://api.jsonbin.io/v3/b/${c.bin}`,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':c.key},body:JSON.stringify({trades:S.trades,capitalLogs:S.capitalLogs,settings:{...S.settings,cloudKey:'',cloudBin:''}})});
    if(!res.ok)throw new Error(res.status);S.settings.lastBackup=new Date().toISOString();S.save();render();toast('Backed up to the cloud ✓')}
  catch(e){toast('Could not reach the cloud — check key & bin ID')}
}
async function pullCloud(){
  const c=cloudCreds();if(!c.key||!c.bin)return toast('Add your JSONBin key and bin ID first');
  if(!await ask({title:'Restore from cloud?',msg:'This replaces the data on this device.',ok:'Restore',danger:true}))return;
  try{const res=await fetch(`https://api.jsonbin.io/v3/b/${c.bin}/latest`,{headers:{'X-Master-Key':c.key}});if(!res.ok)throw new Error(res.status);
    const p=(await res.json()).record;if(!p)throw new Error('empty');applyRestore(p);toast('Restored from the cloud ✓')}
  catch(e){toast('Could not retrieve data — check key & bin ID')}
}
function applyRestore(p){
  S.trades=(Array.isArray(p)?p:(p.trades||[])).map(normTrade);S.capitalLogs=p.capitalLogs||[];
  if(p.settings)S.settings={...clone(DEFAULT_SETTINGS),...p.settings,uiv:3,onboarded:true,cloudKey:S.settings.cloudKey,cloudBin:S.settings.cloudBin,lastBackup:S.settings.lastBackup,alerts:{...DEFAULT_SETTINGS.alerts,...(p.settings.alerts||{})}};
  S.save();applyTheme();render();
}
function exportJSON(){
  if(!S.trades.length&&!S.capitalLogs.length)return toast('Nothing to back up yet');
  download(`QuantumTrade_Backup_${todayKey()}.json`,JSON.stringify({schemaVersion:'3.0.0',exportTimestamp:new Date().toISOString(),trades:S.trades,capitalLogs:S.capitalLogs,settings:{...S.settings,cloudKey:'',cloudBin:''}},null,2),'application/json');
}
function importJSON(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=async()=>{try{const p=JSON.parse(r.result);if(!Array.isArray(p)&&!Array.isArray(p.trades))throw 0;
    if(await ask({title:'Restore this backup?',msg:'Your current data will be overwritten.',ok:'Restore',danger:true})){applyRestore(p);toast('Backup restored ✓')}}
    catch(err){toast('That file is not a valid backup')}};
  r.readAsText(f);e.target.value='';
}
async function wipeAll(){
  if(!await ask({title:'Delete all data?',msg:'All trades, capital entries and settings on this device will be erased.',ok:'Continue',danger:true}))return;
  if(!await ask({title:'Are you absolutely sure?',msg:'This cannot be undone. Export a backup first if unsure.',ok:'Delete everything',danger:true}))return;
  localStorage.removeItem(STORE_KEY);location.reload();
}

/* ================= INIT ================= */
function splashRun(){
  const msgs=['Loading your journal…','Syncing trades…','Preparing dashboard…','Ready'],el=$('#sp-status');
  [2000,2700,3300,3800].forEach((t,i)=>setTimeout(()=>{if(el&&$('#splash').style.display!=='none')el.textContent=msgs[i]},t));
  setTimeout(()=>finishSplash('auto'),4200);
}
function finishSplash(mode){
  if(mode!=='auto'){S.settings.onboarded=true;S.save()}const sp=$('#splash');sp.classList.add('out');setTimeout(()=>{sp.style.display='none'},420);
  if(mode==='restore')showView('data','push');
}
function init(){
  S.load();applyTheme();hydrate();
  ['trade','detail','cap','gen','print'].forEach(id=>dragSheet($('#sheet-'+id)));
  {const sp=$('#splash');sp.style.display='flex';if(S.settings.onboarded){sp.classList.add('auto');splashRun()}}
  const nm=todayKey().slice(0,7);
  if(S.trades.length&&!S.trades.some(t=>dayKey(t).slice(0,7)===nm))period={kind:'all',ym:null};
  const h=(location.hash||'').slice(1);const st=history.state||{};depth=st.d||0;
  curView='';showView(VIEWS.includes(h)&&h!=='sub'?h:'home','replace');
  addEventListener('storage',e=>{if(e.key===STORE_KEY){S.load();render()}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetOpen)render()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlg').classList.contains('show'))dlgDone(false);else closeSheet()}});
}
document.addEventListener('DOMContentLoaded',init);
